<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline · Slate</title>
    <meta name="theme-color" content="#FAF8F5">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
    <section class="error-shell">
        <div class="error-card">
            <h1 class="error-h1">You&rsquo;re offline.</h1>
            <p class="error-sub">
                Slate needs an internet connection to load. Please reconnect and try again &mdash;
                this page will refresh automatically once you&rsquo;re back online.
            </p>
            <div class="error-actions">
                <button type="button" class="btn btn-outline" onclick="window.location.reload();">
                    Try again
                </button>
            </div>
        </div>
    </section>

    <script>
        // Auto-reload the moment the browser sees a network again.
        window.addEventListener('online', () => window.location.reload());
    </script>
</body>
</html>
